<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prüfungsvorbereitung SoSe 2026</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <h1>Prüfungsvorbereitung SoSe 2026</h1>
    <p>PDF-Zusammenfassungen und Lernmaterialien für meine Kurse im 4. Semester.</p>
    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
      <a href="downloads/all-pdfs.zip" class="global-download-btn" download>
        Alle PDFs herunterladen
      </a>
      <button id="random-subject-btn" class="global-download-btn" style="background: var(--accent-rose); border: none; cursor: pointer;">
        🎲 Zufallsfach
      </button>
    </div>
  </header>

  <main>
    <!-- Update Info Panel -->
    <div class="update-panel" id="update-panel" style="display:none;">
      <div class="update-panel-header">
        <span class="update-panel-icon">🔄</span>
        <div>
          <div class="update-panel-title">Letztes Update</div>
          <div class="update-panel-date" id="update-date"></div>
        </div>
        <button class="update-panel-toggle" id="update-panel-toggle" aria-label="Neue Vorlesungen anzeigen">&#9660;</button>
      </div>
      <div class="update-panel-body" id="update-panel-body" style="display:none;">
        <div class="update-panel-subtitle">Neu hinzugefügt:</div>
        <ul class="update-panel-list" id="update-panel-list"></ul>
      </div>
    </div>

    <div class="controls">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Nach PDFs suchen..." aria-label="Suchen">
      </div>
      <div class="filter-box" id="filter-container">
        <!-- Filter buttons are injected via JS -->
      </div>
    </div>

    <!-- Main Content Area -->
    <div id="content-container">
      <!-- Sections are injected here by JS -->
    </div>
  </main>

  <!-- Fullscreen Preview Overlay -->
  <div class="preview-overlay" id="preview-overlay">
    <div class="preview-header">
      <div class="preview-title" id="preview-title">PDF Vorschau</div>
      <div class="preview-actions">
        <a id="preview-open-link" class="preview-open-btn" target="_blank" aria-label="In neuem Fenster öffnen">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </a>
        <button class="close-preview" id="close-preview" aria-label="Schließen">&times;</button>
      </div>
    </div>
    <div class="preview-container">
      <iframe id="preview-frame" title="PDF Vorschau" src="" allowfullscreen></iframe>
    </div>
  </div>

  <!-- Random Subject Wheel Modal -->
  <div class="modal-overlay" id="random-modal">
    <div class="modal-content">
      <button class="close-modal" id="close-random-modal" aria-label="Schließen">&times;</button>
      <h2 style="margin-bottom: 1rem; color: var(--text-dark);">Welches Fach heute?</h2>
      <div class="wheel-container">
        <div class="wheel-roulette" id="wheel-roulette">
          <!-- Subject items injected here -->
        </div>
      </div>
      <button id="go-to-random-subject" class="btn btn-primary" style="display: none; margin-top: 1.5rem; width: 100%; font-size: 1rem; padding: 0.75rem;">Los geht's!</button>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
